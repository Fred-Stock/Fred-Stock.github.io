@keyframes ip-show { from { opacity: 0; } to { opacity: 1; } }

@keyframes ip-fly {

  1% { opacity: 1; transform: translate(var(--dx), var(--dy)); }
  99% { opacity: 1; transform: translate(0, 0); }
  100% { opacity: 0; transform: translate(0, 0); }
}
